            cycG//oLJEXdTzsevi8j1RC1gTW+4rMBN3+FXAPSNUzAeH735uY/0CtDUofPvghnKhIEhx+AdEfy9x9zvvH4f4j9PxDXcgAA
        run: |
          $dir = "C:\rdp-setup"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # The setup script (Persian keyboard + Alt+Shift + dark theme + Chrome
          # default) is stored here as gzip+base64 so this file stays standalone.
          $bytes = [Convert]::FromBase64String($env:SETUP_B64)
          $ms = New-Object System.IO.MemoryStream
          $ms.Write($bytes, 0, $bytes.Length)
          $ms.Position = 0
          $gs = New-Object System.IO.Compression.GzipStream($ms, [System.IO.Compression.CompressionMode]::Decompress)
          $sr = New-Object System.IO.StreamReader($gs, [System.Text.Encoding]::UTF8)
          $script = $sr.ReadToEnd()
          $sr.Close(); $gs.Close(); $ms.Close()

          [System.IO.File]::WriteAllText("$dir\Setup-UserEnvironment.ps1", $script, (New-Object System.Text.UTF8Encoding($true)))
          Write-Host "Setup script written: $dir\Setup-UserEnvironment.ps1" -ForegroundColor Green

      - name: 3. Create Admin Account
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Secret RDP_PASSWORD is not set."
          }
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          # If C:\Users\behrad already exists, Windows appends the machine name to
          # the profile folder. Move a leftover (non-profile) folder aside so the
          # profile lands exactly at C:\Users\behrad.SMJP.
          $StaleFolder = "C:\Users\behrad"
          if (Test-Path $StaleFolder) {
            if (-not (Test-Path (Join-Path $StaleFolder "NTUSER.DAT"))) {
              $Aside = "C:\Users\behrad.old-" + (Get-Date -Format "yyyyMMddHHmmss")
              Rename-Item -Path $StaleFolder -NewName (Split-Path $Aside -Leaf) -ErrorAction SilentlyContinue
              Write-Host "Leftover folder moved: $StaleFolder -> $Aside"
            }
          }

          if (Get-LocalUser -Name "behrad" -ErrorAction SilentlyContinue) {
            Rename-LocalUser -Name "behrad" -NewName "behrad.SMJP" -ErrorAction SilentlyContinue
          }

          New-LocalUser -Name "behrad.SMJP" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          $u = Get-LocalUser -Name "behrad.SMJP" -ErrorAction SilentlyContinue
          if (-not $u) { throw "Failed to create user behrad.SMJP. Check the RDP_PASSWORD secret." }

          Add-LocalGroupMember -Group "Administrators" -Member "behrad.SMJP" -ErrorAction SilentlyContinue
          $admins = Get-LocalGroupMember -Group "Administrators" | ForEach-Object { $_.Name }
          if (-not ($admins -match 'behrad\.SMJP')) { throw "behrad.SMJP was not added to Administrators." }

          net user runneradmin "$env:RDP_PASSWORD"

          # Workspace lives outside C:\Users so the profile folder keeps its exact name.
          New-Item -ItemType Directory -Force -Path "C:\workspace" | Out-Null
          icacls "C:\workspace" /grant "behrad.SMJP:(OI)(CI)F" /T /Q | Out-Null

          # Let the user write the setup log.
          icacls "C:\rdp-setup" /grant "behrad.SMJP:(OI)(CI)M" /T /Q | Out-Null

          Write-Host "Account behrad.SMJP created and verified." -ForegroundColor Cyan

      - name: 4. Restore Persistent Workspace
        uses: actions/cache/restore@v4
        with:
          path: C:\workspace
          key: cynet-rdp-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cynet-rdp-workspace-

      - name: 5. Grant Workspace Permissions
        run: |
          icacls "C:\workspace" /grant "behrad.SMJP:(OI)(CI)F" /T /Q | Out-Null

      - name: 6. Apply User Setup Now (Before You Log In)
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ScriptPath = "C:\rdp-setup\Setup-UserEnvironment.ps1"
          $TaskName   = "BehradUserEnvironmentSetup"
          $TargetUser = "behrad.SMJP"

          $Action  = New-ScheduledTaskAction -Execute "powershell.exe" `
            -Argument "-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$ScriptPath`""
          $Trigger = New-ScheduledTaskTrigger -AtLogOn -User $TargetUser
          $Settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Minutes 30)

          # A stored-password principal runs even with no interactive session, so this
          # both applies the settings now and re-applies them at every later logon.
          Register-ScheduledTask -TaskName $TaskName -Action $Action -Trigger $Trigger `
            -Settings $Settings -User $TargetUser -Password $env:RDP_PASSWORD -Force | Out-Null

          Start-ScheduledTask -TaskName $TaskName

          $ProfilePath = "C:\Users\$TargetUser"
          $ok = $false
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 5
            if (Test-Path (Join-Path $ProfilePath "NTUSER.DAT")) { $ok = $true; break }
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  Username        : behrad.SMJP" -ForegroundColor Yellow
          Write-Host "  Profile Path    : $ProfilePath" -ForegroundColor Yellow
          Write-Host "  Profile Ready   : $ok" -ForegroundColor Yellow
          Write-Host "  Setup Task      : $TaskName (at each logon)" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

          Write-Host ""
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Username        : behrad.SMJP" -ForegroundColor Yellow
          Write-Host "  Persistent Path : C:\workspace" -ForegroundColor Cyan
          Write-Host "  >> Run the Tailscale step next to get your IP." -ForegroundColor Magenta

          if (Test-Path "C:\rdp-setup\setup.log") {
            Write-Host "--- setup.log (last lines) ---" -ForegroundColor Cyan
            Get-Content "C:\rdp-setup\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            Write-Host "------------------------------"
          } else {
            Write-Host "No setup.log yet; it will be written at the first logon." -ForegroundColor Yellow
          }

      - name: 7. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 8. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP    : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username        : behrad.SMJP" -ForegroundColor Yellow
          Write-Host "  Password        : (from secrets)" -ForegroundColor Yellow
          Write-Host "  Persistent Path : C:\workspace" -ForegroundColor Cyan
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 9. Show Current Workspace Files
        run: |
          Write-Host "----- current contents of the workspace folder -----" -ForegroundColor Cyan
          Get-ChildItem -Path "C:\workspace" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length, LastWriteTime
          Write-Host "----------------------------------------"

      - name: 10. Keep Server Alive (5 Hours 40 Minutes)
        run: |
          for ($i = 1; $i -le 340; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/340] Windows RDP Server active..."
          }

      - name: 11. Save Workspace to Cloud
        uses: actions/cache/save@v4
        if: always()
        with:
          path: C:\workspace
          key: cynet-rdp-workspace-${{ github.run_id }}-${{ github.run_attempt }}
